title: Saroj Ratul
tagline: Electrical engineering student. I build small hardware and write up how it went.
description: Hardware build logs by Saroj Ratul, Electrical Engineering at the University of Saskatchewan.
author: Saroj Ratul
email: saroj.ratul@gmail.com
github: sarojratul
url: https://sarojratul.github.io
timezone: America/Regina
lang: en

# minima stays as the base theme, but every layout it provides is overridden here,
# and assets/main.scss replaces its stylesheet entirely.
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Top navigation, in this order.
nav:
  - title: Air Mouse
    url: /comet-air-mouse/
  - title: Turn Signal
    url: /turn-signal/
  - title: About
    url: /about/

kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: "2..3"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: series-post

exclude:
  - README.md
