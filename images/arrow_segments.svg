<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="Helvetica, Arial, sans-serif">
<rect width="1100" height="460" fill="#ffffff"/>
<text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Double-headed arrow: four independently switched segments</text>
<text x="550" y="58" text-anchor="middle" font-size="13.5" fill="#555">Mounted horizontally on the backpack. Segments B and C are shared by both directions.</text>
<path d="M 90 210 L 300 92 L 300 172 L 380 172 L 380 248 L 300 248 L 300 328 Z" fill="#f6b73c" stroke="#b8801c" stroke-width="2" stroke-linejoin="round"/><path d="M 380 172 L 550 172 L 550 248 L 380 248 Z" fill="#e8918f" stroke="#bd5f5d" stroke-width="2" stroke-linejoin="round"/><path d="M 550 172 L 720 172 L 720 248 L 550 248 Z" fill="#8fb8e0" stroke="#5a8cc0" stroke-width="2" stroke-linejoin="round"/><path d="M 1010 210 L 800 92 L 800 172 L 720 172 L 720 248 L 800 248 L 800 328 Z" fill="#86c99a" stroke="#4a9464" stroke-width="2" stroke-linejoin="round"/>
<line x1="550" y1="80" x2="550" y2="344" stroke="#8b8b8b" stroke-width="1.3" stroke-dasharray="6,5"/>
<text x="550" y="74" text-anchor="middle" font-size="12" fill="#888">centre</text>
<text x="235" y="222" text-anchor="middle" font-size="34" font-weight="bold" fill="#6f4700">A</text>
<text x="465" y="222" text-anchor="middle" font-size="34" font-weight="bold" fill="#7d2323">B</text>
<text x="635" y="222" text-anchor="middle" font-size="34" font-weight="bold" fill="#1b4569">C</text>
<text x="865" y="222" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a5c2d">D</text>
<text x="235" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Left arrowhead</text>
<text x="235" y="385" text-anchor="middle" font-size="13" fill="#666">10 LEDs, 5 strings</text>
<text x="235" y="403" text-anchor="middle" font-size="12.5" fill="#888">123.9 mA</text>
<text x="465" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Body left</text>
<text x="465" y="385" text-anchor="middle" font-size="13" fill="#666">6 LEDs, 3 strings</text>
<text x="465" y="403" text-anchor="middle" font-size="12.5" fill="#888">74.3 mA</text>
<text x="635" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Body right</text>
<text x="635" y="385" text-anchor="middle" font-size="13" fill="#666">6 LEDs, 3 strings</text>
<text x="635" y="403" text-anchor="middle" font-size="12.5" fill="#888">74.3 mA</text>
<text x="865" y="366" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Right arrowhead</text>
<text x="865" y="385" text-anchor="middle" font-size="13" fill="#666">10 LEDs, 5 strings</text>
<text x="865" y="403" text-anchor="middle" font-size="12.5" fill="#888">123.9 mA</text>
<path d="M 300 100 L 130 100" stroke="#8a5a00" stroke-width="3"/>
<path d="M 126 100 l 18 -10 l 0 20 z" fill="#8a5a00"/>
<text x="316" y="105" font-size="13.5" font-weight="bold" fill="#8a5a00">LEFT: C, then B, then A</text>
<path d="M 800 100 L 970 100" stroke="#1f6b34" stroke-width="3"/>
<path d="M 974 100 l -18 -10 l 0 20 z" fill="#1f6b34"/>
<text x="784" y="105" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1f6b34">RIGHT: B, then C, then D</text>
<text x="550" y="434" text-anchor="middle" font-size="13" fill="#333">The sweep accumulates outward from the centre. STEP_MS = 120, CYCLE_MS = 800.</text>
<text x="550" y="453" text-anchor="middle" font-size="12.5" fill="#777">One GPIO and one AO3400A MOSFET per segment: 32 LEDs, 16 strings, 4 segments, 4 MOSFETs, 4 GPIOs.</text>
</svg>