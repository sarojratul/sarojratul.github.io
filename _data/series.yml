# One entry per project. The home page lists them in this order.
comet-air-mouse:
  title: COMET Air Mouse
  short: Air Mouse
  url: /comet-air-mouse/
  summary: A gyroscope-driven Bluetooth LE mouse, reworked into a classroom presenter remote with slide keys and a recenter gesture.
  status: active
  status_label: In progress
  image: /images/comet_breadboard_test.jpg
  image_alt: Two Seeed XIAO ESP32-C3 boards on a breadboard, the lower one powered over USB-C
  image_position: center 72%
  tags: [ESP32-C3, Bluetooth LE HID, MPU-6050]
  started: September 2026

fc200v-emulator:
  title: FC-200V Calculator Emulator
  short: FC-200V App
  url: /fc200v-emulator/
  summary: A native Android emulator of the CASIO FC-200V financial calculator, built with Claude Code from the official manual so I could practise for an Engineering Economics midterm before the real calculator arrived.
  status: paused
  status_label: Waiting on Google account verification
  image: /images/fc200v_card.jpg
  image_alt: The emulator in CMPD mode showing FV = 16761.07897
  image_position: center 20%
  tags: [Android, Java, Firebase, AdMob, Claude Code]
  started: October 2026

turn-signal:
  title: Wireless Bicycle Turn Signal
  short: Turn Signal
  url: /turn-signal/
  summary: A 32-LED amber arrow for a backpack, driven by an ESP32-C3 and commanded over ESP-NOW from a handlebar remote.
  status: paused
  status_label: Paused for winter
  image: /images/arrow_topdown.jpg
  image_alt: The 32-LED arrow laid out on the breadboard
  tags: [ESP32-C3, ESP-NOW, MOSFET drive, LTspice]
  started: August 2026
